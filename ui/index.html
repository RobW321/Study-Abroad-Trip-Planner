
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Abroad Trip Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Study Abroad Trip Planner</h1>
        <p>Manage your trips and track your expenses.</p>
    </header>

    <main>
        <section class="panel">
            <h2>Your Trips</h2>
            <div id="trip-list">
                Loading trips...
            </div>
        </section>

        <section class="panel">
            <h2>Create a Trip</h2>

            <form id="trip-form">
                <input name="name" placeholder="Trip name" required>
                <input name="destination" placeholder="Destination" required>
                <label>Start date</label>
                <input name="start_date" type="date" required>
                <label>End date</label>
                <input name="end_date" type="date" required>
                <input name="planned_budget" type="number"
                       min="0" step="0.01"
                       placeholder="Planned budget" required>
                <button type="submit">Create Trip</button>
            </form>
        </section>

        <section class="panel" id="trip-details" hidden>
            <h2>Trip Details</h2>
            <div id="trip-information"></div>

            <h3>Expenses</h3>
            <div id="expense-list"></div>

            <h3>Add an Expense</h3>
            <form id="expense-form">
                <input name="description"
                       placeholder="Description" required>
                <input name="amount" type="number"
                       min="0" step="0.01"
                       placeholder="Amount" required>
                <input name="category"
                       placeholder="Category" required>
                <button type="submit">Add Expense</button>
            </form>

            <div id="budget-summary"></div>
        </section>

        <p id="message" role="status"></p>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
