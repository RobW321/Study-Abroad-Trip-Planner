openapi: 3.0.3

info:
  title: Expenses Service API
  description: API for managing trip expenses.
  version: 1.0.0

servers:
  - url: http://localhost:5002
    description: Local development server

paths:
  /health:
    get:
      summary: Check service and database health
      operationId: healthCheck
      responses:
        "200":
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database is unavailable

  /expenses:
    post:
      summary: Create an expense
      operationId: createExpense
      description: >
        Validates the referenced trip through the Trips service
        before creating the expense in its own database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense created successfully
        "400":
          description: Missing or invalid expense data
        "404":
          description: Referenced trip does not exist
        "503":
          description: Trips service is unavailable
        "504":
          description: Trips service request timed out

  /expenses/{expense_id}:
    parameters:
      - name: expense_id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Retrieve an expense
      operationId: getExpense
      responses:
        "200":
          description: Expense found
        "404":
          description: Expense does not exist

    put:
      summary: Update an expense
      operationId: updateExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Expense updated successfully
        "400":
          description: Invalid expense data
        "404":
          description: Expense does not exist

    delete:
      summary: Delete an expense
      operationId: deleteExpense
      responses:
        "200":
          description: Expense deleted successfully
        "404":
          description: Expense does not exist

  /trips/{trip_id}/expenses:
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: List expenses for a trip
      operationId: listTripExpenses
      responses:
        "200":
          description: List of expenses associated with the trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  expenses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Expense"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        database:
          type: string
          example: connected
        version:
          type: string
          example: 1.0.0

    Expense:
      type: object
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        description:
          type: string
        amount:
          type: number
        category:
          type: string

    ExpenseInput:
      type: object
      required:
        - trip_id
        - description
        - amount
        - category
      properties:
        trip_id:
          type: integer
        description:
          type: string
        amount:
          type: number
        category:
          type: string

    ExpenseUpdate:
      type: object
      properties:
        description:
          type: string
        amount:
          type: number
        category:
          type: string
